<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Banners | Ryuzen Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/css/global.css?v=20260526admin-center"><link rel="stylesheet" href="/assets/css/components.css?v=20260526admin-center"><link rel="stylesheet" href="/assets/css/admin-shell.css?v=20260526admin-center"><link rel="stylesheet" href="/assets/css/admin-blog.css?v=20260526admin-center"></head><body data-admin-section="banners"><div class="admin-app"><aside data-admin-nav></aside><main class="admin-content"><button class="btn ghost admin-mobile-toggle" data-admin-menu type="button">☰ Menu</button><section class="admin-view"><header class="admin-page-head"><div><p class="eyebrow">Promoção</p><h1>Banners promocionais</h1><p>Substitua banners públicos por URL mantendo os padrões atuais como fallback.</p></div><span class="admin-session-badge">Sessão segura ativa</span></header><p id="bannerFeedback" class="admin-alert hidden"></p><div class="admin-two-columns"><section class="admin-card"><h2>Configuração</h2><form id="bannerForm" class="admin-form-grid"><input type="hidden" id="bannerId"><label>Nome interno<input class="field" id="bannerName" maxlength="120" required></label><label>Posição<select class="field" id="bannerPlacement" required><option value="blog_sidebar_left">Sidebar esquerda do blog</option><option value="blog_sidebar_right">Sidebar direita do blog</option><option value="blog_inline_horizontal">Banner horizontal</option><option value="blog_home_featured">Destaque do blog</option></select></label><label>URL da imagem<input class="field" type="url" id="bannerImageUrl" placeholder="https://..." required></label><label>Texto alternativo<input class="field" id="bannerAlt" maxlength="240" required></label><label>URL de destino<input class="field" type="url" id="bannerTargetUrl" placeholder="https://..." required></label><label>Status<select class="field" id="bannerStatus"><option value="inactive">Inativo</option><option value="active">Ativo</option><option value="archived">Arquivado</option></select></label><img id="bannerPreview" class="banner-admin-preview hidden" alt="Prévia do banner"><div class="row-actions"><button class="btn primary" type="submit">Salvar banner</button><button id="clearBanner" class="btn ghost" type="button">Novo</button></div></form></section><section class="admin-card"><div class="admin-toolbar compact"><select id="bannerFilterPlacement" class="field"><option value="">Todas as posições</option><option value="blog_sidebar_left">Sidebar esquerda</option><option value="blog_sidebar_right">Sidebar direita</option><option value="blog_inline_horizontal">Horizontal</option><option value="blog_home_featured">Destaque</option></select><select id="bannerFilterStatus" class="field"><option value="">Todos os status</option><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="archived">Arquivados</option></select></div><div id="bannersList" class="admin-list-table"></div></section></div></section></main></div><script src="/assets/js/admin-auth.js?v=20260526admin-center"></script><script src="/assets/js/admin-shell.js?v=20260526admin-center"></script><script src="/assets/js/admin-banners.js?v=20260526admin-center"></script></body></html>
