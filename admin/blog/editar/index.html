<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar post | Painel Editorial Ryuzen</title><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' https:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/css/global.css?v=20260525"><link rel="stylesheet" href="/assets/css/components.css?v=20260525"><link rel="stylesheet" href="/assets/css/pages.css?v=20260525"><link rel="stylesheet" href="/assets/css/admin-blog.css?v=20260525"></head><body><main class="admin-panel"><form id="postEditorForm" class="admin-shell"><header class="admin-topbar"><div><p class="eyebrow">Blog — Painel Editorial</p><h1>Editar artigo</h1><p>Escreva normalmente, configure imagens por URL e publique quando estiver pronto.</p></div><div class="admin-actions"><a class="btn ghost" href="/admin/blog/">Voltar</a><button id="adminLogout" class="btn ghost" type="button">Sair</button></div></header><p id="editorFeedback" class="admin-alert hidden"></p><div class="admin-editor-layout"><section class="admin-editor-card"><input id="postTitle" class="field title" maxlength="180" placeholder="Título do artigo" required><div class="editor-toolbar" aria-label="Formatação"><button class="editor-tool" type="button" data-command="formatBlock" data-value="P">Texto</button><button class="editor-tool" type="button" data-command="formatBlock" data-value="H2">H2</button><button class="editor-tool" type="button" data-command="formatBlock" data-value="H3">H3</button><button class="editor-tool" type="button" data-command="bold"><strong>B</strong></button><button class="editor-tool" type="button" data-command="italic"><em>I</em></button><button class="editor-tool" type="button" data-command="createLink">Link</button><button class="editor-tool" type="button" data-command="undo">↶</button><button class="editor-tool" type="button" data-command="redo">↷</button><button class="editor-tool" type="button" data-command="insertUnorderedList">• Lista</button><button class="editor-tool" type="button" data-command="insertOrderedList">1. Lista</button><button class="editor-tool" type="button" data-command="formatBlock" data-value="BLOCKQUOTE">Citação</button><button class="editor-tool" type="button" data-command="insertHorizontalRule">Linha</button><button id="openImageModal" class="editor-tool" type="button">Imagem</button></div><div id="richEditor" class="rich-editor blog-content" contenteditable="true" role="textbox" aria-multiline="true"></div><div class="admin-editor-footer"><button id="previewPost" class="btn ghost" type="button">Pré-visualizar</button><button id="saveDraft" class="btn ghost" type="button">Salvar rascunho</button><button id="publishPost" class="btn primary" type="button">Publicar</button></div></section><aside class="admin-settings-card"><section class="admin-fieldset"><h2>Publicação</h2><label>Slug<input id="postSlug" class="field" maxlength="150" required></label><label>Resumo<textarea id="excerpt" maxlength="320" required></textarea></label><label>Categoria<select id="categoryId"><option value="">Sem categoria</option></select></label><label>Tags<input id="tags" class="field" placeholder="isekai, lançamentos, fantasia"></label></section><section class="admin-fieldset"><h2>Imagem de capa</h2><label>URL da capa<input id="coverImageUrl" class="field" type="url" placeholder="https://..."></label><label>Texto alternativo<input id="coverAlt" class="field" maxlength="240"></label><label>Crédito<input id="coverCredit" class="field" maxlength="240"></label><label>URL da fonte<input id="coverSourceUrl" class="field" type="url"></label><label>Imagem social opcional<input id="socialImageUrl" class="field" type="url"></label></section><section class="admin-fieldset"><h2>SEO</h2><label>Título SEO<input id="seoTitle" class="field" maxlength="180"></label><label>Meta description<textarea id="seoDescription" maxlength="320"></textarea></label><label>Canonical<input id="canonicalUrl" class="field" type="url"></label><div class="seo-preview"><strong id="seoPreviewTitle">Título do artigo</strong><small id="seoPreviewUrl"></small><p id="seoPreviewDescription">Descrição exibida nos mecanismos de pesquisa.</p></div></section></aside></div></form></main><section id="adminAccessGate" class="admin-modal hidden"><form id="adminAccessForm" class="admin-modal-panel admin-login-panel"><p class="eyebrow">Área restrita</p><h2>Acessar edição</h2><label>Chave administrativa<input id="adminToken" class="field" type="password" required></label><p id="adminAccessError" class="admin-alert error hidden"></p><div class="modal-actions"><button class="btn primary" type="submit">Entrar</button></div></form></section><section id="imageModal" class="admin-modal hidden"><form id="imageForm" class="admin-modal-panel"><div class="modal-head"><h2>Inserir imagem por URL</h2></div><div class="modal-form"><label>URL da imagem<input id="inlineImageUrl" class="field" type="url" required></label><label>Texto alternativo obrigatório<input id="inlineImageAlt" class="field" maxlength="240" required></label><label>Legenda<input id="inlineImageCaption" class="field" maxlength="400"></label><label>Crédito<input id="inlineImageCredit" class="field" maxlength="240"></label><label>URL da fonte oficial<input id="inlineImageSource" class="field" type="url"></label></div><div class="modal-actions"><button id="cancelImage" class="btn ghost" type="button">Cancelar</button><button id="insertImage" class="btn primary" type="button">Inserir</button></div></form></section><section id="previewModal" class="admin-modal hidden"><div class="admin-modal-panel wide"><div class="modal-head"><h2>Prévia do artigo</h2><button id="closePreview" class="btn ghost" type="button">Fechar</bu
