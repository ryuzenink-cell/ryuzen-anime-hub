<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ryuzen">

  <link rel="icon" type="image/svg+xml" href="/assets/images/logo-placeholder.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/layout.css">

  <link rel="stylesheet" href="../assets/css/responsive.css">

<body>
  <div data-header></div>
  <main>
    <section class="page-hero blog-page-hero">
      <div class="container blog-hero-grid">
        <div>
          <p class="eyebrow">Ryuzen Editorial</p>
          <h1>Blog do Ryuzen Anime Hub</h1>
          <p>Guias, análises, listas e bastidores para transformar o Hub em uma central editorial viva sobre animes, mangás, light novels e cultura otaku.</p>
          <div class="blog-search-box">
            <label class="sr-only" for="blogSearch">Buscar posts</label>
            <input id="blogSearch" class="field" type="search" placeholder="Buscar por título, tema, categoria ou tag">
          </div>
        </div>
        <aside id="blogFeatured" aria-label="Post em destaque"></aside>
      </div>
    </section>

    <section class="section compact-section">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Categorias</p>
            <h2>Explore o editorial</h2>
          </div>
        </div>
        <div id="blogCategories" class="filters"></div>
      </div>
    </section>

    <section class="section compact-section">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Últimos posts</p>
            <h2>Publicações recentes</h2>
          </div>
        </div>
        <div id="blogGrid" class="blog-grid"></div>
      </div>
    </section>
  </main>
  <div data-footer></div>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CW8SW35Y3N"></script>
