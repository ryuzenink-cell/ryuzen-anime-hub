<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busca de Animes | Ryuzen Anime Hub</title>
  <meta name="description" content="Busque animes por nome e abra detalhes completos com dados da Jikan API.">
  <link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/pages.css"><link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div data-header></div>
  <main class="container">
    <section class="page-hero">
      <p class="eyebrow">Busca</p><h1>Encontre seu próximo anime.</h1>

      </form>
    </section>
    <section class="section" aria-live="polite"><div id="searchResults"></div><button id="loadMore" class="btn hidden" type="button">Carregar mais</button></section>
  </main>
  <div data-footer></div>
  <script src="assets/js/api.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/search.js"></script>

</html>
